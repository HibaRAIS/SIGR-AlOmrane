# Base de données
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sigr_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=sigr_alomrane_secret_key_very_long_minimum_256_bits_secure
jwt.expiration=86400000

# CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Application
spring.application.name=sigr
server.port=8081

# LDAP embarqué
spring.ldap.embedded.base-dn=dc=alomrane,dc=ma
spring.ldap.embedded.ldif=classpath:users.ldif
spring.ldap.embedded.port=8489

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.alomrane.sigr.service.ReceptionService=DEBUG

# Désactiver l'auto-configuration de sécurité LDAP
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Tomcat
server.tomcat.max-http-form-post-size=10MB
server.max-http-header-size=16KB

# Groq
groq.api.key=${GROQ_API_KEY}